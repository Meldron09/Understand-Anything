<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive lesson</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:44rem;margin:2rem auto;padding:0 1rem;color:#1b1b1b;background:#fafafa}
h1{font-size:1.4rem}h2{font-size:1.15rem;margin:0 0 .5rem}
.widget{border:1px solid #bbb;border-radius:10px;padding:1rem 1.25rem;margin:1.5rem 0;background:#fff}
.lead{margin:.25rem 0 .75rem}
.demo{background:#f3f5fa;border-radius:8px;padding:.75rem;margin:.5rem 0}
.takeaway{font-weight:600;margin:.75rem 0 0}.takeaway:before{content:"Takeaway: ";color:#2a5bd7}
.out{min-height:1.5rem;margin:.5rem 0;white-space:pre-wrap}
button{font:inherit;padding:.4rem .8rem;margin:.2rem .2rem .2rem 0;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer}
button.on{background:#d9e4ff;border-color:#2a5bd7}
input[type=range]{width:100%}
svg{max-width:100%;height:auto;background:#fff;border-radius:6px}
svg .hot{fill:#d9e4ff;stroke:#2a5bd7;cursor:pointer}
.hidden{display:none}
.tip{color:#444;font-size:.9rem;min-height:1.4rem}
footer{color:#666;font-size:.85rem;margin-top:2rem}
</style>
</head>
<body>
<main id="lesson">
